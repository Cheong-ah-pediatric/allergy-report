<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>알레르기 항원 보고서 생성기 - 청아소아청소년과</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #f2f4f7;
  --white: #fff;
  --ink: #1c1c2e;
  --ink2: #52526e;
  --accent: #2d5a8e;
  --accent-lt: #e8f0f8;
  --border: #dde1e9;
  --shadow: 0 2px 10px rgba(0,0,0,0.07);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}

/* ── 앱 헤더 ── */
.app-header{
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:12px 24px;
  display:flex;align-items:center;gap:14px;
  box-shadow:0 1px 4px rgba(0,0,0,0.06);
}
.app-header img{height:36px;object-fit:contain;}
.app-header .divider{width:1px;height:26px;background:#dde1e9;}
.app-header .title{font-size:14px;font-weight:600;color:var(--accent);}
.app-header .sub{margin-left:auto;font-size:11px;color:#aaa;}

/* ── 레이아웃 ── */
.app-body{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 57px);}

/* ── 입력 패널 ── */
.input-panel{
  background:var(--white);
  border-right:1px solid var(--border);
  padding:20px 18px;
  display:flex;flex-direction:column;gap:16px;
  overflow-y:auto;
}
.panel-title{
  font-size:11px;font-weight:700;letter-spacing:0.8px;
  color:var(--accent);text-transform:uppercase;
  border-bottom:1.5px solid var(--accent-lt);padding-bottom:6px;
}
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-group label{font-size:11px;font-weight:600;color:var(--ink2);}
.form-group input{
  padding:8px 10px;border:1.5px solid var(--border);border-radius:6px;
  font-family:inherit;font-size:13px;color:var(--ink);background:#fafbfc;outline:none;
  transition:border-color .15s;
}
.form-group input:focus{border-color:var(--accent);background:#fff;}

.hint{
  font-size:11px;color:#888;line-height:1.6;
  background:#f7f8fa;border:1px solid var(--border);border-radius:5px;padding:8px 10px;
}
.hint code{background:#e8eaf0;padding:1px 4px;border-radius:3px;font-size:10.5px;}

textarea{
  padding:10px;border:1.5px solid var(--border);border-radius:6px;
  font-family:inherit;font-size:12px;color:var(--ink);background:#fafbfc;
  resize:vertical;min-height:150px;line-height:1.6;outline:none;
  transition:border-color .15s;width:100%;
}
textarea:focus{border-color:var(--accent);background:#fff;}

.btn-gen{
  background:var(--accent);color:#fff;border:none;border-radius:7px;
  padding:12px;font-family:inherit;font-size:13px;font-weight:700;
  cursor:pointer;letter-spacing:0.3px;transition:background .15s;
}
.btn-gen:hover{background:#1f3f66;}
.btn-print{
  background:transparent;color:var(--accent);border:1.5px solid var(--accent);
  border-radius:7px;padding:9px;font-family:inherit;font-size:12px;font-weight:600;
  cursor:pointer;transition:all .15s;
}
.btn-print:hover{background:var(--accent-lt);}
.err{color:#c0392b;font-size:11px;background:#fdf0ef;border:1px solid #f5c6c3;border-radius:4px;padding:7px 9px;display:none;}

/* ── 결과 패널 ── */
.result-panel{padding:24px 28px;overflow-y:auto;}
.placeholder{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:10px;color:#bbb;font-size:13px;text-align:center;padding:60px 0;
}

/* ────────────────────────────────────────
   보고서 (화면 + 인쇄 공통)
──────────────────────────────────────── */
.report{display:none;max-width:760px;}

/* 헤더 */
.rpt-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  border-bottom:2px solid var(--accent);padding-bottom:10px;margin-bottom:12px;
}
.rpt-head img{height:32px;object-fit:contain;}
.rpt-head-right{text-align:right;}
.rpt-title{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.rpt-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;}
.meta-item{display:flex;flex-direction:column;gap:1px;}
.meta-lbl{font-size:9px;color:var(--ink2);letter-spacing:0.4px;font-weight:600;text-transform:uppercase;}
.meta-val{font-size:13px;font-weight:700;color:var(--ink);}
.meta-val.ige{color:var(--accent);}

/* 요약 바 */
.summary{
  background:var(--accent-lt);border:1px solid #c5d9ee;border-radius:5px;
  padding:7px 12px;margin-bottom:10px;font-size:11px;color:var(--accent);
}

/* ── 메인 테이블 ── */
.rpt-table{
  width:100%;border-collapse:collapse;font-size:11px;
  margin-bottom:10px;
}
.rpt-table th{
  background:#2d5a8e;color:#fff;
  padding:5px 7px;text-align:left;font-size:10px;font-weight:600;
  letter-spacing:0.3px;white-space:nowrap;
}
.rpt-table th:first-child{border-radius:0;}
.rpt-table td{
  padding:5px 7px;border-bottom:1px solid #eaecf0;vertical-align:top;
  line-height:1.45;
}
.rpt-table tr:hover td{background:#f7f9fc;}

/* Class 배지 */
.cb{
  display:inline-flex;align-items:center;justify-content:center;
  width:42px;height:18px;border-radius:9px;font-size:9.5px;font-weight:700;color:#fff;
  white-space:nowrap;
}
.c1{background:#27ae60;} .c2{background:#f39c12;} .c3{background:#e67e22;}
.c4{background:#e74c3c;} .c5{background:#c0392b;} .c6{background:#8e44ad;}

/* 교차반응 태그 */
.ctags{display:flex;flex-wrap:wrap;gap:2px;}
.ct{
  background:#fdf3e8;color:#7b3f00;border:1px solid #f0d5b3;
  padding:1px 5px;border-radius:8px;font-size:9.5px;white-space:nowrap;
}

/* 항원명 */
.aname{font-weight:600;font-size:11.5px;}
.season-badge{
  display:inline-block;background:#e8f0f8;color:#2d5a8e;
  padding:1px 5px;border-radius:8px;font-size:9px;margin-left:3px;
  vertical-align:middle;
}

/* 주의사항 */
.warn-txt{color:#c0392b;font-weight:500;}
/* 개선방법 */
.imp-txt{color:#1a5c3a;font-weight:500;}

/* 푸터 */
.rpt-footer{
  font-size:9px;color:#aaa;line-height:1.7;
  border-top:1px solid var(--border);padding-top:8px;margin-top:8px;
}

/* ────────────────────────────────────────
   인쇄 스타일
──────────────────────────────────────── */
@media print {
  @page{size:A4 portrait;margin:12mm 12mm 12mm 12mm;}
  body{background:#fff;}
  .app-header,.input-panel{display:none!important;}
  .app-body{display:block;}
  .result-panel{padding:0;overflow:visible;}
  .report{display:block!important;max-width:100%;}
  .rpt-table th{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .cb{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .ct{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .summary{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .rpt-head img{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  * {font-size:10px!important;}
  .rpt-title{font-size:14px!important;}
  .meta-val{font-size:12px!important;}
  .aname{font-size:11px!important;}
}

/* ── AI 분석 섹션 ── */
.ai-section {
  margin-top: 16px;
  border: 1.5px solid #c5d9ee;
  border-radius: 8px;
  overflow: hidden;
  background: #fff;
}
.ai-section-header {
  background: linear-gradient(135deg, #2d5a8e 0%, #1a3f6f 100%);
  color: #fff;
  padding: 10px 16px;
  display: flex; align-items: center; gap: 8px;
}
.ai-section-header .ai-badge {
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.3);
  padding: 2px 8px; border-radius: 10px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
}
.ai-section-header .ai-title {
  font-size: 13px; font-weight: 700;
}
.ai-section-header .ai-sub {
  font-size: 10px; opacity: 0.7; margin-left: auto;
}
.ai-body {
  padding: 16px;
  font-size: 12px; line-height: 1.8; color: #2c2c3e;
}
.ai-body.loading {
  display: flex; align-items: center; gap: 10px;
  color: #888; font-size: 12px; padding: 20px 16px;
}
.ai-spinner {
  width: 16px; height: 16px;
  border: 2px solid #dde1e9;
  border-top-color: #2d5a8e;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* AI 분석 내용 스타일 */
.ai-body h3 {
  font-size: 12px; font-weight: 700; color: #2d5a8e;
  margin: 12px 0 4px; padding-bottom: 3px;
  border-bottom: 1px solid #e8f0f8;
}
.ai-body h3:first-child { margin-top: 0; }
.ai-body ul { padding-left: 16px; margin: 4px 0; }
.ai-body li { margin-bottom: 3px; }
.ai-body strong { color: #1c1c2e; }
.ai-body .highlight {
  background: #fff8e1; border-left: 3px solid #f39c12;
  padding: 6px 10px; margin: 8px 0; border-radius: 0 4px 4px 0;
  font-size: 11px;
}
.ai-body .warning {
  background: #fdf0ef; border-left: 3px solid #c0392b;
  padding: 6px 10px; margin: 8px 0; border-radius: 0 4px 4px 0;
  font-size: 11px;
}
.ai-body .safe {
  background: #f0fdf4; border-left: 3px solid #27ae60;
  padding: 6px 10px; margin: 8px 0; border-radius: 0 4px 4px 0;
  font-size: 11px;
}
.ai-error {
  color: #c0392b; font-size: 11px; padding: 12px 16px;
  background: #fdf0ef;
}

@media print {
  .ai-section { border: 1px solid #ccc; margin-top: 12px; page-break-before: always; }
  .ai-section-header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .ai-spinner { display: none; }
}

/* ── 클라우드 / 이력 ── */
.form-group select{
  padding:8px 10px;border:1.5px solid var(--border);border-radius:6px;
  font-family:inherit;font-size:13px;color:var(--ink);background:#fafbfc;outline:none;
}
.lbl-note{font-weight:400;color:#aaa;font-size:10px;}
.btn-sm{flex:1;padding:6px;font-size:11px;font-weight:600;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:5px;cursor:pointer;font-family:inherit;}
.btn-sm.danger{background:transparent;color:#c0392b;border-color:#f5c6c3;}
.btn-sm.ghost{background:transparent;color:var(--accent);}
.cloud-box{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--ink2);}
.cloud-box input{padding:7px 9px;border:1.5px solid var(--border);border-radius:6px;font-family:inherit;font-size:12px;background:#fafbfc;outline:none;}
.cloud-box .on{color:#27ae60;font-weight:600;}
.cloud-box .off{color:#999;line-height:1.6;}
.local-key summary{font-size:11px;color:var(--ink2);cursor:pointer;}
.hist-box{display:none;flex-direction:column;gap:3px;margin-top:4px;}
.hist-box.show{display:flex;}
.hist-title{font-size:10px;color:var(--ink2);font-weight:600;}
.hist-item{display:flex;align-items:center;gap:6px;font-size:11px;background:#f7f9fc;border:1px solid var(--border);border-radius:5px;padding:4px 7px;}
.hist-item .d{font-weight:600;color:var(--ink);}
.hist-item .m{color:#888;flex:1;}
.hist-item button{border:none;background:none;cursor:pointer;font-size:11px;color:var(--accent);padding:0 2px;font-family:inherit;}
.hist-item button.x{color:#c0392b;}
.hist-empty{font-size:10px;color:#aaa;}

.cloud-status{font-size:10.5px;color:#888;margin-bottom:8px;}
.cloud-status.ok{color:#27ae60;}
.cloud-status.bad{color:#c0392b;}
.unmatched{background:#fff8e1;border:1px solid #f3d27a;color:#7a5600;border-radius:5px;padding:7px 10px;font-size:11px;margin-bottom:10px;}

.risk-badge{display:inline-block;background:#fdecea;color:#c0392b;padding:1px 5px;border-radius:8px;font-size:9px;margin-left:3px;vertical-align:middle;font-weight:600;}
.comp-note{font-size:9.5px;color:#6b6b85;margin-top:2px;line-height:1.4;}
.food-note{background:#f0fdf4;border:1px solid #bfe5cc;color:#1a5c3a;border-radius:5px;padding:7px 10px;font-size:11px;margin-bottom:10px;}

/* 이전 검사 대비 변화 */
.cmp-section{margin-top:14px;border:1.5px solid #d9cfee;border-radius:8px;overflow:hidden;}
.cmp-head{background:#5b4a8e;color:#fff;padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;}
.cmp-head .sub{margin-left:auto;font-size:10px;font-weight:400;opacity:.85;}
.cmp-body{padding:10px 14px;font-size:11px;}
.cmp-ige{font-size:12px;margin-bottom:6px;}
.cmp-ige .up{color:#c0392b;font-weight:700;} .cmp-ige .down{color:#27ae60;font-weight:700;}
.cmp-chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
.cmp-chip{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;border:1px solid currentColor;}
.cmp-table{width:100%;border-collapse:collapse;font-size:11px;}
.cmp-table th{background:#efeaf8;color:#4a3c78;text-align:left;padding:4px 7px;font-size:10px;}
.cmp-table td{padding:4px 7px;border-bottom:1px solid #eee;}
.cb.c0{background:#bbb;}
.cmp-same{margin-top:6px;color:#888;font-size:10.5px;}
.cmp-note{margin-top:6px;color:#9a6b00;font-size:10.5px;}
.cmp-hist{margin-top:6px;color:#666;font-size:10.5px;}
.ai-tools{margin-left:auto;}
.ai-tools button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;font-size:10px;padding:2px 8px;cursor:pointer;font-family:inherit;}

@media print {
  .no-print{display:none!important;}
  .cmp-head,.cmp-table th,.cb.c0,.risk-badge,.food-note{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .cmp-section{page-break-inside:avoid;}
}

/* 특이 IgE · 면역치료 */
.val-line{font-size:10px;color:#2d5a8e;font-weight:600;margin-top:2px;}
.val{font-size:10px;color:#555;}
.convert-note{font-size:10.5px;color:#7a5600;margin-top:-8px;}
.convert-note:empty{display:none;}
.neg-line{font-size:10.5px;color:#777;margin:-4px 0 10px;}
.it-box{display:none;flex-direction:column;gap:5px;background:#f6f3fc;border:1px solid #e0d8f2;border-radius:6px;padding:8px 9px;font-size:11px;}
.it-title{font-weight:700;color:#4a3c78;font-size:11.5px;}
.it-box .on{color:#27ae60;font-weight:600;}
.it-box .m{color:#888;font-size:10px;}
.it-item{background:#fff;border:1px solid #e6e0f3;border-radius:5px;padding:5px 7px;}
.it-item.ended{opacity:.75;}
.it-item .acts{display:flex;gap:8px;margin-top:2px;}
.it-item .acts button{border:none;background:none;cursor:pointer;font-size:10.5px;color:var(--accent);padding:0;font-family:inherit;}
.it-item .acts button.x{color:#c0392b;}
.it-form{display:flex;flex-direction:column;gap:4px;}
.it-form label{font-size:10px;color:var(--ink2);font-weight:600;margin-top:2px;}
.it-form input,.it-form select{padding:6px 8px;border:1.5px solid var(--border);border-radius:5px;font-family:inherit;font-size:12px;background:#fff;}
.it-form .row{display:flex;gap:6px;margin-top:4px;}
.it-section{margin-top:14px;border:1.5px solid #cfe3d6;border-radius:8px;overflow:hidden;}
.it-head{background:#2d7a4f;color:#fff;padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;}
.it-head .sub{margin-left:auto;font-size:10px;font-weight:400;opacity:.9;}
.it-courses{margin-bottom:8px;line-height:2;}
.it-chip{display:inline-block;background:#f1f1f1;color:#555;border-radius:10px;padding:1px 8px;font-size:10.5px;}
.it-chip.on{background:#e3f4ea;color:#1a5c3a;font-weight:600;}
.cur-row td{background:#fffbe6;font-weight:600;}
.it-charts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.it-chart{border:1px solid #eee;border-radius:6px;padding:6px 8px;}
.it-chart .t{font-size:10.5px;font-weight:600;color:#444;margin-bottom:2px;}
.itl-head{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.itl-filters{display:flex;flex-wrap:wrap;gap:4px;}
.itl-filters button{border:1px solid var(--border);background:#fff;border-radius:12px;padding:3px 10px;font-size:11px;cursor:pointer;font-family:inherit;color:var(--ink2);}
.itl-filters button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.itl td{vertical-align:middle;}
.itl .m{color:#888;font-size:10px;}
.due.warn{color:#b9770e;font-weight:700;}
.due.bad{color:#c0392b;font-weight:700;}
@media (max-width:700px){ .it-charts{grid-template-columns:1fr;} }
@media print {
  .it-head,.it-chip,.cur-row td{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .it-section{page-break-inside:avoid;}
}
</style>
</head>

</header>

<div class="app-body">
  <!-- 입력 패널 -->
  <div class="input-panel">
    <div class="panel-title">클라우드 · 환자 기록 공유</div>
    <div id="cloudBox" class="cloud-box"></div>
    <button id="itListBtn" class="btn-sm ghost" style="display:none;" onclick="showITList()">💊 면역치료 환자 목록</button>

    <details id="localKeyBox" class="local-key">
      <summary>로컬 API 키 (클라우드 미사용 시)</summary>
      <div class="form-group" style="margin-top:8px;">
        <input type="password" id="apiKey" placeholder="sk-ant-..." style="font-family:monospace;font-size:11px;">
        <div style="display:flex;gap:6px;margin-top:6px;">
          <button onclick="saveApiKey()" class="btn-sm">저장</button>
          <button onclick="clearApiKey()" class="btn-sm danger">삭제</button>
        </div>
        <div id="apiKeyStatus" style="font-size:10px;margin-top:4px;color:#999;"></div>
        <div style="font-size:10px;color:#aaa;margin-top:3px;">
          클라우드에 로그인하면 키 없이 AI 분석이 됩니다.
        </div>
      </div>
    </details>

    <hr style="border:none;border-top:1px solid var(--border);margin:0;">
    <div class="panel-title">환자 정보</div>
    <div class="form-group">
      <label>등록번호 <span class="lbl-note">— 이전 검사 조회·비교 기준</span></label>
      <input type="text" id="pid" placeholder="예) 12345">
      <div id="histBox" class="hist-box"></div>
    </div>
    <div id="itBox" class="it-box"></div>
    <div class="form-group">
      <label>이름 <span class="lbl-note">— 인쇄용, 클라우드에 저장 안 됨</span></label>
      <input type="text" id="pname" placeholder="홍길동">
    </div>
    <div class="form-group">
      <label>Total IgE (IU/mL)</label>
      <input type="text" id="ige" placeholder="예) 285">
    </div>
    <div class="form-group">
      <label>검사일</label>
      <input type="date" id="testDate">
    </div>
    <div class="form-group">
      <label>검사 패널</label>
      <select id="panel">
        <option value="MAST120">MAST 120종</option>
        <option value="sIgE">특이 IgE (수치 직접 입력)</option>
        <option value="기타">기타</option>
      </select>
    </div>

    <div class="panel-title" id="inputTitle" style="margin-top:4px;">검사 결과 붙여넣기</div>
    <div class="hint" id="inputHint">
      검사실 보고 형식 그대로:<br>
      <code>- Class 1 : 느릅나무, 미루나무</code><br>
      <code>- Class 2 : 개암나무, 참나무, ...</code>
    </div>
    <textarea id="rawInput" onpaste="onRawPaste()" placeholder="- Class 1 : 느릅나무, 미루나무, 소나무&#10;- Class 2 : 개암나무, 참나무&#10;- Class 3 : 오리나무&#10;..."></textarea>
    <div id="convertNote" class="convert-note"></div>

    <div class="err" id="errMsg"></div>
    <button class="btn-gen" onclick="generate()">보고서 생성</button>
    <button class="btn-print" onclick="window.print()">🖨 인쇄 / PDF 저장</button>
  </div>

  <!-- 결과 패널 -->
  <div class="result-panel" id="resultPanel">
    <div class="placeholder" id="placeholder">
      <svg width="56" height="56" viewBox="0 0 64 64" fill="none">
        <rect x="8" y="4" width="40" height="52" rx="4" stroke="#ccc" stroke-width="2"/>
        <line x1="16" y1="16" x2="40" y2="16" stroke="#ccc" stroke-width="2"/>
        <line x1="16" y1="24" x2="40" y2="24" stroke="#ccc" stroke-width="2"/>
        <line x1="16" y1="32" x2="32" y2="32" stroke="#ccc" stroke-width="2"/>
      </svg>
      <span>왼쪽에 환자 정보와 검사 결과를 입력하면<br>보고서가 이곳에 표시됩니다</span>
    </div>
    <div class="report" id="report"></div>
  </div>

const KEYMAP = {};
function addKey(k, entry) {

  if (!key) return;
  if (KEYMAP[key] && KEYMAP[key].id !== entry.id) console.warn("별칭 충돌", key, KEYMAP[key].id, entry.id);

}

// 최적 문자열 정렬 거리 (인접 글자 뒤바뀜 = 1)
function osa(a, b) {
  const m = a.length, n = b.length;
  if (Math.abs(m - n) > 2) return 9;
  const d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {
    const c = a[i - 1] === b[j - 1] ? 0 : 1;
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c);
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[m][n];
}
function fuzzyKey(k) {
  if (k.length < 3) return null;                  // dp/df 같은 2글자는 보정하지 않음 (서로 1글자 차이)
  const maxD = k.length >= 6 ? 2 : 1;
  let best = null, bestD = 9, tie = false;
  for (const key of Object.keys(KEYMAP)) {
    if (key.length < 3) continue;
    const d = osa(k, key);
    if (d < bestD) { best = key; bestD = d; tie = false; }
    else if (best && d === bestD && KEYMAP[key].id !== KEYMAP[best].id) tie = true;
  }
  return best && bestD <= maxD && !tie ? best : null;
}
function resolveName(name) {
  const k = loose(name);
  if (!k) return null;
  if (KEYMAP[k]) return { ...KEYMAP[k], fuzzy: false };
  const f = fuzzyKey(k);
  return f ? { ...KEYMAP[f], fuzzy: true } : null;
}
function findAllergen(name) {
  const r = resolveName(name);
  return r && r.type === "db" ? r.item : null;
}
const FOOD_COMPONENT = /^(계란|우유|밀가루|메밀|땅콩|콩|사과|복숭아|헤이즐넛|호두|새우|대구|돼지고기|소고기) 성분/;

const CLASS_LV = {0:"음성",1:"낮음",2:"경도",3:"중등도",4:"중등-중증",5:"중증",6:"최중증"};
const CLASS_COLOR = {0:"c0",1:"c1",2:"c2",3:"c3",4:"c4",5:"c5",6:"c6"};
const SIGE_CUTS = [0.35, 0.7, 3.5, 17.5, 50, 100];   // kU/L → Class 1..6
function sigeClass(v, op) {
  const x = op === "<" ? v - 1e-9 : v;
  return SIGE_CUTS.filter(t => x >= t).length;
}

// ── 입력 파싱 → entries [{name, canon, kind:'IgE'|'IgG', cls, value, op, item, fuzzy}] ──
function parseMast(raw) {
  const out = [];
  raw.split("\n").forEach(line => {
    const m = line.match(/class\s*(\d+)\s*[:\-]\s*(.+)/i);
    if (!m) return;
    const cls = parseInt(m[1]);
    m[2].split(/[,，、]/).map(n => n.trim()).filter(Boolean).forEach(name => out.push({ name, cls, value: null, op: "" }));
  });
  return { list: out, bad: [] };
}
const OPS = { "<": "<", "<=": "≤", "≤": "≤", ">": ">", ">=": "≥", "≥": "≥" };
function parseNumeric(raw) {
  const out = [], bad = [];
  raw.split(/[\n,;，、]+/).forEach(chunk => {
    const c = chunk.replace(/k?ua?\s*\/\s*l|iu\s*\/\s*ml|mg\s*\/\s*l|[uμ]g\s*\/\s*ml/gi, " ");
    // 이름 [:=] [부등호] 숫자 [(class N)]
    const re = /([a-z가-힣][a-z가-힣().\-\s]*?)\s*[:=]?\s*(<=?|>=?|≥|≤)?\s*(\d+(?:\.\d+)?)(?:\s*\(?\s*class\s*([0-6])\s*\)?)?/gi;
    let m, any = false;
    while ((m = re.exec(c))) {
      any = true;
      out.push({ name: m[1].trim(), op: OPS[m[2]] || "", value: parseFloat(m[3]),
                 isInt: !m[3].includes("."), cls: m[4] != null ? +m[4] : null });
    }
    if (!any && c.trim()) bad.push(chunk.trim());
  });
  return { list: out, bad };
}
function buildEntries(panel, raw) {
  const numeric = PANELS[panel].numeric;
  const { list, bad } = numeric ? parseNumeric(raw) : parseMast(raw);
  const entries = list.map(x => {
    const r = resolveName(x.name);
    if (r && r.type === "marker")
      return { name: x.name, canon: r.id, kind: "IgG", cls: null, value: x.value, op: x.op, item: null, fuzzy: r.fuzzy };
    const item = r ? r.item : null;
    let cls = x.cls, value = x.value;
    if (!numeric) value = null;
    else if (cls == null) {
      // 검사실이 Class로 보고한 값(dp 5) = 소수점 없는 0~6 → Class, 그 외는 kU/L 수치로 보고 Class 계산
      if (x.isInt && !x.op && x.value <= 6) { cls = x.value; value = null; }
      else cls = sigeClass(x.value, x.op);
    }
    return { name: x.name, canon: item ? item["항목명"] : null, kind: "IgE",
             cls, value, op: value == null ? "" : x.op, item, fuzzy: !!(r && r.fuzzy) };
  });
  return { entries, bad };
}

// 입력 앞부분의 검사일·Total IgE 읽기: "2025-12-01 cap ige 974 dp 5 df 6 dpg 1.1 dfg 0.8"
function extractMeta(raw) {
  let text = raw, date = null, ige = null;
  const dates = [...raw.matchAll(/(20\d{2})[-./](\d{1,2})[-./](\d{1,2})/g)];
  if (dates.length) {
    const [, y, m, d] = dates[0];
    date = `${y}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
    text = text.replace(dates[0][0], " ");
  }
  const im = text.match(/(?:^|[\s,;])(?:cap|total|t|총)[\s-]*ige\s*[:=]?\s*([<>]?\s*\d+(?:\.\d+)?)/i)
          || text.match(/^\s*ige\s*[:=]?\s*([<>]?\s*\d+(?:\.\d+)?)/im);
  if (im) { ige = im[1].replace(/\s/g, ""); text = text.replace(im[0], " "); }
  return { text: text.trim(), date, ige, multiDate: dates.length > 1 };
}

// 옛 검사 결과 형식 변환: "2  D. pteronyssinus(진드기(Dp))   13.38 3" (순번 이름 수치 Class)
const LEGACY_RE = /^\s*\d+\s+(.+?)\s+((?:[<>≥≤]=?)?\s*\d+(?:\.\d+)?)\s+([0-6])\s*$/;
function legacyName(s) {
  const segs = [s, ...s.split(/[()（）]/)].map(x => x.trim()).filter(Boolean);
  for (const fz of [false, true]) for (const seg of segs) {
    const r = resolveName(seg);
    if (r && r.fuzzy === fz) return r.type === "db" ? r.item["항목명"] : r.id;
  }
  return ((s.match(/[가-힣][가-힣\s]*/) || [s])[0]).trim();   // DB에 없으면 한글 이름 우선
}
function convertLegacy(text) {
  const lines = text.split("\n").filter(l => l.trim());
  const hits = lines.filter(l => LEGACY_RE.test(l)).length;
  if (!hits || hits < lines.length / 2) return null;
  const out = lines.map(l => {
    const m = l.match(LEGACY_RE);
    return m ? `${legacyName(m[1])} ${m[2].replace(/\s/g, "")} (class ${m[3]})` : l;
  });
  return { text: out.join("\n"), n: hits };
}

//  이전 검사와 비교 (코드로 계산 — AI 는 이 결과를 해석만 함)
// ════════════════════════════════════════
const KIND = {
  new:   { label: "신규 양성", color: "#c0392b" },
  up:    { label: "상승",     color: "#e67e22" },
  down:  { label: "하강",     color: "#27ae60" },
  gone:  { label: "음성 전환", color: "#2d7a4f" },
  first: { label: "첫 측정",   color: "#2d5a8e" },
  same:  { label: "유지",     color: "#888" },
};
const KIND_ORDER = { new: 0, up: 1, down: 2, gone: 3, first: 4, same: 5 };
const isIgE = r => (r.kind || "IgE") === "IgE";

function compareTests(prev, cur) {
  const key = r => r.canon || r.name;
  const pm = new Map(prev.results.filter(isIgE).map(r => [key(r), r]));
  const cm = new Map(cur.results.filter(isIgE).map(r => [key(r), r]));
  const prevNum = PANELS[prev.panel] && PANELS[prev.panel].numeric;
  const curNum = PANELS[cur.panel] && PANELS[cur.panel].numeric;
  const rows = [];
  new Set([...pm.keys(), ...cm.keys()]).forEach(k => {
    const p = pm.get(k), c = cm.get(k);
    if (!c && curNum) return;                         // 이번에 측정 안 한 항목 (개별 검사는 일부만 측정)
    const pc = p ? p.cls : 0, cc = c ? c.cls : 0;
    if (!pc && !cc && !(p && c && p.value != null)) return;
    let kind;
    if (!p && prevNum) kind = "first";                // 이전엔 측정 안 함
    else kind = !pc && cc ? "new" : pc && !cc ? "gone" : cc > pc ? "up" : cc < pc ? "down" : "same";
    rows.push({ name: k, prev: pc, cur: cc, prevV: p ? valStr(p) : "", curV: c ? valStr(c) : "", kind });
  });
  rows.sort((a, b) => KIND_ORDER[a.kind] - KIND_ORDER[b.kind] || b.cur - a.cur || b.prev - a.prev);
  const months = (new Date(cur.test_date) - new Date(prev.test_date)) / 86400000 / 30.44;
  return { rows, prev, cur, months, samePanel: prev.panel === cur.panel,
           igeP: igeNum(prev.total_ige), igeC: igeNum(cur.total_ige) };
}

function kindLabel(kind, samePanel) {
  if (!samePanel && kind === "gone") return "이번 미검출*";
  if (!samePanel && kind === "new") return "신규 양성*";
  return KIND[kind].label;
}

function renderCompare(cmp, history) {
  const { rows, prev, cur, months, samePanel, igeP, igeC } = cmp;
  const badge = (c, v) => `<span class="cb ${CLASS_COLOR[c] || "c6"}">${c ? "Class " + c : "음성"}</span>${v ? ` <span class="val">${esc(v)}</span>` : ""}`;
  let ige = "";
  if (igeP != null && igeC != null) {
    const pct = igeP > 0 ? Math.round((igeC - igeP) / igeP * 100) : null;
    const dir = igeC > igeP ? "up" : igeC < igeP ? "down" : "";
    const arrow = igeC > igeP ? "▲" : igeC < igeP ? "▼" : "―";
    ige = `<div class="cmp-ige">Total IgE <b>${esc(prev.total_ige)}</b> → <b>${esc(cur.total_ige)}</b> IU/mL
           <span class="${dir}">${arrow} ${pct != null && pct !== 0 ? Math.abs(pct) + "%" : ""}</span></div>`;
  }
  const chips = Object.keys(KIND).map(k => {
    const n = rows.filter(r => r.kind === k).length;
    return n ? `<span class="cmp-chip" style="color:${KIND[k].color}">${kindLabel(k, samePanel)} ${n}</span>` : "";
  }).join("");
  // 수치가 있는 검사는 같은 Class 안의 수치 변화도 보여줌
  const show = rows.filter(r => r.kind !== "same" || (r.prevV && r.curV && r.prevV !== r.curV));
  const table = show.length
    ? `<table class="cmp-table"><thead><tr><th>항원</th><th style="width:110px;">이전</th><th style="width:110px;">이번</th><th style="width:90px;">변화</th></tr></thead><tbody>
       ${show.map(r => `<tr><td>${esc(r.name)}</td><td>${r.kind === "first" ? "—" : badge(r.prev, r.prevV)}</td><td>${badge(r.cur, r.curV)}</td>
         <td style="color:${KIND[r.kind].color};font-weight:600;">${kindLabel(r.kind, samePanel)}</td></tr>`).join("")}
       </tbody></table>`
    : `<div style="color:#888;">항원별 Class 변화가 없습니다.</div>`;
  const same = rows.filter(r => r.kind === "same" && !show.includes(r));
  const sameLine = same.length
    ? `<div class="cmp-same">변화 없음: ${same.map(r => `${esc(r.name)}(${r.cur})`).join(", ")}</div>` : "";
  const panelNote = samePanel ? "" :
    `<div class="cmp-note">* 이전(${esc(panelLabel(prev.panel))})과 이번(${esc(panelLabel(cur.panel))}) 검사 종류가 달라, 일부 변화는 검사 항목·방법 차이 때문일 수 있습니다.</div>`;
  const past = history.filter(t => t.test_date < cur.test_date);
  const histLine = past.length > 1
    ? `<div class="cmp-hist">검사 이력: ${[...past].reverse().map(t => `${esc(t.test_date)}${t.total_ige ? ` (IgE ${esc(t.total_ige)})` : ""}`).join(" → ")} → <b>${esc(cur.test_date)}</b></div>` : "";
  return `
    <div class="cmp-section">
      <div class="cmp-head">이전 검사 대비 변화
        <span class="sub">${esc(prev.test_date)} → ${esc(cur.test_date)} · 약 ${Math.max(0, Math.round(months))}개월 간격</span></div>
      <div class="cmp-body">${ige}<div class="cmp-chips">${chips}</div>${table}${sameLine}${panelNote}${histLine}</div>
    </div>`;
}

function compareText(cmp) {
  const { rows, prev, cur, months, samePanel, igeP, igeC } = cmp;
  const L = [`이전 검사 ${prev.test_date}(${panelLabel(prev.panel)}) → 이번 검사 ${cur.test_date}(${panelLabel(cur.panel)}), 간격 약 ${Math.round(months)}개월`];
  if (igeP != null && igeC != null) L.push(`Total IgE: ${prev.total_ige} → ${cur.total_ige} IU/mL`);
  Object.keys(KIND).forEach(k => {
    const rs = rows.filter(r => r.kind === k);
    if (rs.length) L.push(`${KIND[k].label}: ` + rs.map(r =>
      `${r.name} Class ${r.prev}→${r.cur}${r.prevV || r.curV ? ` (${r.prevV || "-"}→${r.curV || "-"} kU/L)` : ""}`).join(", "));
  });
  if (!samePanel) L.push("※ 두 검사의 종류가 달라 신규 양성/음성 전환 일부는 검사 항목·방법 차이 때문일 수 있음");
  return L.join("\n");
}

// ════════════════════════════════════════
const IT_DRUGS = ["스타로랄", "액트에어", "라이스정"];
const IT_END_REASONS = ["효과 부족 → 변경", "부작용", "복용 불편·순응도", "치료 완료", "기타"];
// Dp/Df IgG 단위는 mg/L (검사실 보고 단위)
const IGG_UNIT = c => c.endsWith("IgG") ? " (mg/L)" : "";
const TREND = [["집먼지진드기(Dp)", "Dp IgE"], ["집먼지진드기(Df)", "Df IgE"], ["Dp IgG", "Dp IgG"], ["Df IgG", "Df IgG"]];
let itCache = [];

async function fetchCourses(pid) {
  const { data, error } = await sb.from("immunotherapy_courses").select("*")
    .eq("chart_no", pid).order("start_date", { ascending: false });
  if (error) throw error;
  return data || [];
}
function courseAt(date, courses) {
  return courses.find(c => c.start_date <= date && (!c.end_date || date <= c.end_date)) || null;
}
function itLabelAt(date, courses) {
  if (!courses.length) return "";
  const c = courseAt(date, courses);
  if (c) return `${c.drug} ${monthsSince(c.start_date, date) + 1}개월째`;
  const first = courses.reduce((m, x) => x.start_date < m ? x.start_date : m, "9999");
  return date < first ? "치료 전" : "치료 안 함";
}
// 진드기 4항목(Dp/Df IgE·IgG)이 있는 검사만 날짜순으로
function trendRows(tests) {
  return tests.map(t => {
    const v = {};
    (t.results || []).forEach(r => { const k = r.canon || r.name; if (TREND.some(([c]) => c === k)) v[k] = r; });
    return { t, v };
  }).filter(x => Object.keys(x.v).length)
    .sort((a, b) => a.t.test_date.localeCompare(b.t.test_date));
}
function fmtVal(r) {
  if (!r) return "—";
  if (r.value != null) return `${r.op || ""}${r.value}`;
  return r.cls ? `Class ${r.cls}` : "음성";
}

const SER_COLOR = ["#2d5a8e", "#e67e22"];
function trendChart(title, ser, rows, courses, byClass) {
  const yv = r => byClass ? r.cls : r.value;   // IgE 는 Class(MAST·특이 IgE 공통 축), IgG 는 수치
  const pts = ser.map(([c, l]) => ({ l, p: rows.filter(x => x.v[c] && yv(x.v[c]) != null)
    .map(x => ({ d: +new Date(x.t.test_date), y: yv(x.v[c]), date: x.t.test_date })) }));
  if (!pts.some(s => s.p.length >= 2)) return "";
  const all = pts.flatMap(s => s.p);
  const W = 330, H = 150, L = 34, R = 10, T = 18, B = 24;
  const x0 = Math.min(...all.map(p => p.d)); let x1 = Math.max(...all.map(p => p.d)); if (x1 === x0) x1 = x0 + 1;
  const ymax = byClass ? 6.5 : Math.max(...all.map(p => p.y)) * 1.15 || 1;
  const X = d => L + (d - x0) / (x1 - x0) * (W - L - R), Y = y => H - B - (y / ymax) * (H - B - T);
  const ticks = byClass ? [0, 2, 4, 6] : [0, ymax / 2, ymax];
  const grid = ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}" stroke="#eee"/>
    <text x="${L - 4}" y="${Y(t) + 3}" text-anchor="end" font-size="8" fill="#999">${+t.toFixed(1)}</text>`).join("");
  const marks = courses.filter(c => { const d = +new Date(c.start_date); return d >= x0 && d <= x1; }).map(c => {
    const x = X(+new Date(c.start_date));
    return `<line x1="${x}" x2="${x}" y1="${T}" y2="${H - B}" stroke="#5b4a8e" stroke-dasharray="3,3"/>
      <text x="${x + 2}" y="${T - 4}" font-size="8" fill="#5b4a8e">${esc(c.drug)} 시작</text>`;
  }).join("");
  const lines = pts.map((s, i) => s.p.length ? `<polyline fill="none" stroke="${SER_COLOR[i]}" stroke-width="2"
      points="${s.p.map(p => `${X(p.d)},${Y(p.y)}`).join(" ")}"/>` + s.p.map(p =>
      `<circle cx="${X(p.d)}" cy="${Y(p.y)}" r="2.5" fill="${SER_COLOR[i]}"/>
       <text x="${X(p.d)}" y="${Y(p.y) - 5}" text-anchor="middle" font-size="8" fill="${SER_COLOR[i]}">${p.y}</text>`).join("") : "").join("");
  const xl = [...new Set(all.map(p => p.date))].map(dt =>
    `<text x="${X(+new Date(dt))}" y="${H - B + 12}" text-anchor="middle" font-size="7.5" fill="#888">${dt.slice(2, 7)}</text>`).join("");
  const legend = pts.map((s, i) => `<span style="color:${SER_COLOR[i]}">● ${s.l}</span>`).join(" ");
  return `<div class="it-chart"><div class="t">${title} ${legend}</div><svg viewBox="0 0 ${W} ${H}" width="100%">${grid}${marks}${lines}${xl}</svg></div>`;
}

function renderITSection(courses, rows) {
  const now = courses.find(c => !c.end_date);
  const asc = [...courses].sort((a, b) => a.start_date.localeCompare(b.start_date));
  const courseLine = asc.length
    ? asc.map(c => `<span class="it-chip ${c.end_date ? "" : "on"}">${esc(c.drug)} ${esc(c.start_date)} ~ ${c.end_date ? esc(c.end_date) : "진행 중"}${c.end_reason ? ` · ${esc(c.end_reason)}` : ""}</span>`).join(" → ")
    : `<span style="color:#888;">면역치료 기록 없음</span>`;
  const table = rows.length ? `<table class="cmp-table"><thead><tr><th>검사일</th><th>치료</th>${TREND.map(([c, l]) => `<th>${l}${IGG_UNIT(c)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(({ t, v }) => `<tr${t.__cur ? ' class="cur-row"' : ""}><td>${esc(t.test_date)}</td><td>${esc(itLabelAt(t.test_date, courses) || "—")}</td>
      ${TREND.map(([c]) => `<td>${esc(fmtVal(v[c]))}</td>`).join("")}</tr>`).join("")}</tbody></table>` : "";
  const charts = [["특이 IgE (Class)", TREND.slice(0, 2), true], ["IgG (mg/L)", TREND.slice(2), false]]
    .map(([title, ser, byClass]) => trendChart(title, ser, rows, courses, byClass)).join("");
  return `<div class="it-section"><div class="it-head">면역치료 경과 모니터링
      <span class="sub">${now ? `현재 ${esc(now.drug)} · ${monthsSince(now.start_date, todayISO()) + 1}개월째` : ""}</span></div>
    <div class="cmp-body"><div class="it-courses">${courseLine}</div>${table}
      ${charts ? `<div class="it-charts">${charts}</div>` : ""}
      <div class="cmp-note" style="color:#666;">※ 수치는 치료 반응을 보조적으로 확인하는 지표이며, 효과 판단은 증상 호전이 가장 중요합니다.</div></div></div>`;
}

function itText(courses, rows) {
  const L = [];
  const asc = [...courses].sort((a, b) => a.start_date.localeCompare(b.start_date));
  if (asc.length) asc.forEach(c => L.push(`- ${c.drug}: ${c.start_date} ~ ${c.end_date || "현재 진행 중"} (약 ${monthsSince(c.start_date, c.end_date || todayISO())}개월)${c.end_reason ? `, 종료 사유: ${c.end_reason}` : ""}${c.note ? `, 메모: ${c.note}` : ""}`));
  else L.push("- 면역치료 기록 없음");
  if (rows.length) {
    L.push("[진드기 수치 추이 (IgE는 Class, IgG 단위 mg/L)]");
    rows.forEach(({ t, v }) => L.push(`- ${t.test_date} (${itLabelAt(t.test_date, courses) || "치료 정보 없음"}): ` +
      TREND.map(([c, l]) => `${l} ${fmtVal(v[c])}`).join(", ")));
  }
  return L.join("\n");
}

// ── 왼쪽 패널: 면역치료 기록 입력 ──
function renderITBox(mode, id) {
  const box = $("itBox"), pid = $("pid").value.trim();
  if (!cloudReady() || !pid) { box.innerHTML = ""; box.style.display = "none"; return; }
  box.style.display = "flex";
  const cur = itCache.find(c => !c.end_date);
  const list = itCache.map(c => `<div class="it-item ${c.end_date ? "ended" : "ongoing"}">
      <div><b>${esc(c.drug)}</b> ${esc(c.start_date)} ~ ${c.end_date ? esc(c.end_date) : '<span class="on">진행 중</span>'}
        <span class="m">(${monthsSince(c.start_date, c.end_date || todayISO())}개월)</span></div>
      ${c.end_reason ? `<div class="m">종료: ${esc(c.end_reason)}</div>` : ""}
      ${c.note ? `<div class="m">메모: ${esc(c.note)}</div>` : ""}
      <div class="acts">${c.end_date ? "" : `<button onclick="renderITBox('end','${c.id}')">종료</button>`}
        <button class="x" onclick="deleteCourse('${c.id}')">삭제</button></div></div>`).join("");
  let form = "";
  if (mode === "start") form = `<div class="it-form">
      <label>${cur ? "새 약" : "약"}</label>
      <select id="itDrug">${IT_DRUGS.map(d => `<option>${d}</option>`).join("")}<option value="기타">기타(직접 입력)</option></select>
      <input id="itDrugOther" placeholder="약 이름" style="display:none">
      <label>시작일</label><input type="date" id="itStart" value="${todayISO()}">
      ${cur ? `<label>기존 ${esc(cur.drug)} 종료 사유</label>
        <select id="itPrevReason">${IT_END_REASONS.map(r => `<option>${r}</option>`).join("")}</select>` : ""}
      <input id="itNote" placeholder="메모 (변경 이유, 용량 등 — 선택)">
      <div class="row"><button class="btn-sm" onclick="saveCourse()">저장</button>
        <button class="btn-sm ghost" onclick="renderITBox()">취소</button></div></div>`;
  if (mode === "end") form = `<div class="it-form">
      <label>종료일</label><input type="date" id="itEnd" value="${todayISO()}">
      <label>종료 사유</label><select id="itReason">${IT_END_REASONS.filter(r => r !== "효과 부족 → 변경").map(r => `<option>${r}</option>`).join("")}<option>효과 부족(중단)</option></select>
      <input id="itNote" placeholder="메모 (선택)">
      <div class="row"><button class="btn-sm" onclick="endCourse('${id}')">종료 저장</button>
        <button class="btn-sm ghost" onclick="renderITBox()">취소</button></div></div>`;
  box.innerHTML = `<div class="it-title">💊 면역치료${cur ? ` <span class="on">· ${esc(cur.drug)} 진행 중</span>` : ""}</div>
    ${list || '<div class="m">기록 없음</div>'}
    ${form || `<button class="btn-sm ghost" onclick="renderITBox('start')">${cur ? "약 변경" : "+ 치료 시작 등록"}</button>`}`;
  if (mode === "start") $("itDrug").onchange = () => { $("itDrugOther").style.display = $("itDrug").value === "기타" ? "" : "none"; };
}
async function refreshIT() {
  const pid = $("pid").value.trim();
  if (!cloudReady() || !pid) { itCache = []; renderITBox(); return; }
  try { itCache = await fetchCourses(pid); }
  catch (e) { $("itBox").style.display = "flex"; $("itBox").innerHTML = `<div class="m" style="color:#c0392b;">면역치료 조회 실패: ${esc(e.message)}</div>`; return; }
  if (pid !== $("pid").value.trim()) return;
  renderITBox();
}
async function saveCourse() {
  const pid = $("pid").value.trim();
  let drug = $("itDrug").value;
  if (drug === "기타") drug = $("itDrugOther").value.trim();
  const start = $("itStart").value, note = $("itNote").value.trim() || null;
  if (!drug) return alert("약 이름을 입력하세요.");
  if (!start) return alert("시작일을 입력하세요.");
  const cur = itCache.find(c => !c.end_date);
  if (cur) {
    if (start < cur.start_date) return alert(`새 시작일이 기존 ${cur.drug} 시작일(${cur.start_date})보다 빠릅니다.`);
    const { error } = await sb.from("immunotherapy_courses")
      .update({ end_date: start, end_reason: $("itPrevReason").value }).eq("id", cur.id);
    if (error) return alert("기존 치료 종료 실패: " + error.message);
  }
  const { error } = await sb.from("immunotherapy_courses").insert({ chart_no: pid, drug, start_date: start, note });
  if (error) return alert("저장 실패: " + error.message);
  refreshIT();
}
async function endCourse(id) {
  const c = itCache.find(x => x.id === id);
  const end = $("itEnd").value, add = $("itNote").value.trim();
  if (!end) return alert("종료일을 입력하세요.");
  if (c && end < c.start_date) return alert("종료일이 시작일보다 빠릅니다.");
  const note = add ? [c && c.note, add].filter(Boolean).join(" / ") : (c && c.note) || null;
  const { error } = await sb.from("immunotherapy_courses")
    .update({ end_date: end, end_reason: $("itReason").value, note }).eq("id", id);
  if (error) return alert("저장 실패: " + error.message);
  refreshIT();
}
async function deleteCourse(id) {
  const c = itCache.find(x => x.id === id);
  if (!c || !confirm(`${c.drug} (${c.start_date}~) 기록을 삭제할까요?\n(되돌릴 수 없습니다)`)) return;
  const { error } = await sb.from("immunotherapy_courses").delete().eq("id", id);
  if (error) alert("삭제 실패: " + error.message);
  refreshIT();
}

// ── 면역치료 환자 목록 ──
let itList = [];
async function showITList() {
  const el = $("report");
  $("placeholder").style.display = "none";
  el.style.display = "block";
  el.innerHTML = '<div style="color:#888;">불러오는 중...</div>';
  el.scrollIntoView({ behavior: "smooth", block: "start" });
  const { data: courses, error } = await sb.from("immunotherapy_courses").select("*");
  if (error) { el.innerHTML = `<div class="ai-error">조회 실패: ${esc(error.message)}</div>`; return; }
  const byPid = new Map();
  courses.forEach(c => { if (!byPid.has(c.chart_no)) byPid.set(c.chart_no, []); byPid.get(c.chart_no).push(c); });
  let tests = [];
  if (byPid.size) {
    const r = await sb.from("allergy_tests").select("chart_no,test_date,panel,results").in("chart_no", [...byPid.keys()]);
    if (r.error) { el.innerHTML = `<div class="ai-error">조회 실패: ${esc(r.error.message)}</div>`; return; }
    tests = r.data || [];
  }
  const today = todayISO();
  itList = [...byPid.entries()].map(([pid, cs]) => {
    const asc = [...cs].sort((a, b) => a.start_date.localeCompare(b.start_date));
    const cur = asc.find(c => !c.end_date);
    const tr = trendRows(tests.filter(t => t.chart_no === pid));
    const last = tr[tr.length - 1];
    let due = { text: "", cls: "" };
    if (cur) {
      if (!last) due = { text: "진드기 검사 기록 없음", cls: "bad" };
      else {
        const m = monthsSince(last.t.test_date, today);
        if (m >= 12) due = { text: `검사 지남 (${m}개월 경과)`, cls: "bad" };
        else if (m >= 6) due = { text: `검사 시기 (${m}개월 경과)`, cls: "warn" };
        else due = { text: `다음 ${addMonths(last.t.test_date, 6)} ~ ${addMonths(last.t.test_date, 12)}`, cls: "" };
      }
    }
    return { pid, asc, cur, last, due, drug: cur ? cur.drug : asc[asc.length - 1].drug };
  }).sort((a, b) => (b.cur ? 1 : 0) - (a.cur ? 1 : 0) || a.pid.localeCompare(b.pid));
  renderITList("진행 중");
}
function renderITList(filter) {
  const F = ["진행 중", ...IT_DRUGS, "검사 필요", "종료", "전체"];
  const pass = r => filter === "전체" ? true : filter === "진행 중" ? !!r.cur : filter === "종료" ? !r.cur
    : filter === "검사 필요" ? !!r.cur && (r.due.cls === "bad" || r.due.cls === "warn") : !!r.cur && r.cur.drug === filter;
  const rows = itList.filter(pass);
  const cnt = f => itList.filter(r => (f === "전체" ? true : f === "진행 중" ? !!r.cur : f === "종료" ? !r.cur
    : f === "검사 필요" ? !!r.cur && (r.due.cls === "bad" || r.due.cls === "warn") : !!r.cur && r.cur.drug === f)).length;
  $("report").innerHTML = `
    <div class="itl-head"><div class="rpt-title">면역치료 환자 목록</div>
      <div class="itl-filters">${F.map(f => `<button class="${f === filter ? "on" : ""}" onclick="renderITList('${f}')">${f} ${cnt(f)}</button>`).join("")}</div></div>
    <table class="rpt-table itl"><thead><tr><th>등록번호</th><th>현재 약</th><th>치료 경과</th><th>약 변경 이력</th><th>최근 진드기 검사</th><th>다음 검사</th><th></th></tr></thead>
    <tbody>${rows.length ? rows.map(r => `<tr>
      <td><b>${esc(r.pid)}</b></td>
      <td>${r.cur ? `<b>${esc(r.cur.drug)}</b>` : `<span style="color:#888;">종료 (${esc(r.drug)})</span>`}</td>
      <td>${r.cur ? `${esc(r.cur.start_date)} 시작<br><span class="m">${monthsSince(r.cur.start_date, todayISO()) + 1}개월째</span>` : `<span class="m">${esc(r.asc[r.asc.length - 1].end_date || "")} 종료</span>`}</td>
      <td>${r.asc.length > 1 ? r.asc.map(c => esc(c.drug)).join(" → ") + `<br><span class="m">${esc(r.asc.filter(c => c.end_reason).map(c => c.end_reason).join(", "))}</span>` : `<span class="m">—</span>`}</td>
      <td>${r.last ? `${esc(r.last.t.test_date)}<br><span class="m">${TREND.map(([c, l]) => r.last.v[c] ? `${l} ${esc(fmtVal(r.last.v[c]))}${IGG_UNIT(c).replace(/[()]/g, "")}` : "").filter(Boolean).join(" · ")}</span>` : '<span class="m">—</span>'}</td>
      <td class="due ${r.due.cls}">${esc(r.due.text)}</td>
      <td><button class="btn-sm ghost" onclick="openPatient('${esc(r.pid)}')">열기</button></td></tr>`).join("")
      : `<tr><td colspan="7" style="color:#888;text-align:center;padding:16px;">해당 환자 없음</td></tr>`}</tbody></table>
    <div class="rpt-footer">다음 검사: 최근 진드기 검사 후 6~12개월 · 6개월 경과 시 '검사 시기', 12개월 경과 시 '검사 지남'</div>`;
}
function openPatient(pid) {
  $("pid").value = pid;
  $("report").style.display = "none";
  $("placeholder").style.display = "";
  refreshHistory();
  $("pid").scrollIntoView({ behavior: "smooth", block: "center" });
}

//  클라우드 (Supabase)
// ════════════════════════════════════════
const cloudReady = () => !!(sb && currentUser);

async function fetchHistory(pid) {
  const { data, error } = await sb.from("allergy_tests").select("*")
    .eq("chart_no", pid).order("test_date", { ascending: false });
  if (error) throw error;
  return data || [];
}
async function saveTest(rec) {
  const { data, error } = await sb.from("allergy_tests")
    .upsert(rec, { onConflict: "chart_no,test_date,panel" }).select().single();
  if (error) throw error;
  return data;
}
async function saveAI(id, html) {
  const { error } = await sb.from("allergy_tests").update({ ai_html: html }).eq("id", id);
  if (error) console.warn("AI 결과 저장 실패", error);
}

function renderCloudBox() {
  const box = $("cloudBox");
  $("itListBtn").style.display = cloudReady() ? "" : "none";
  if (!sb) {
    box.innerHTML = `<div class="off">클라우드 미설정 — 기록 저장·이전 검사 비교가 꺼져 있습니다.<br>(index.html 상단 SUPABASE 설정, SETUP.md 참고)</div>`;
    $("localKeyBox").open = true;
    return;
  }
  if (currentUser) {
    box.innerHTML = `<div class="on">● 로그인됨 · ${esc(currentUser.email)}</div>
      <div style="display:flex;gap:6px;"><button class="btn-sm ghost" onclick="logout()">로그아웃</button></div>`;
  } else {
    box.innerHTML = `
      <input type="email" id="loginEmail" placeholder="병원 계정 이메일" autocomplete="username">
      <input type="password" id="loginPw" placeholder="비밀번호" autocomplete="current-password"
             onkeydown="if(event.key==='Enter')login()">
      <div style="display:flex;gap:6px;"><button class="btn-sm" onclick="login()">로그인</button></div>
      <div id="loginMsg" class="off"></div>`;
  }
}
async function login() {
  const email = $("loginEmail").value.trim(), password = $("loginPw").value;
  $("loginMsg").textContent = "로그인 중...";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { $("loginMsg").textContent = "로그인 실패: " + error.message; $("loginMsg").style.color = "#c0392b"; }
}
async function logout() { await sb.auth.signOut(); }

// 등록번호 입력 시 이전 검사 목록 + 면역치료 기록 표시
let histTimer = null, histCache = [];
function scheduleHistory() {
  clearTimeout(histTimer);
  histTimer = setTimeout(refreshHistory, 400);
}
async function refreshHistory() {
  const box = $("histBox"), pid = $("pid").value.trim();
  refreshIT();
  if (!cloudReady() || !pid) { box.classList.remove("show"); box.innerHTML = ""; histCache = []; return; }
  try {
    histCache = await fetchHistory(pid);
  } catch (e) {
    box.innerHTML = `<div class="hist-empty" style="color:#c0392b;">기록 조회 실패: ${esc(e.message)}</div>`;
    box.classList.add("show"); return;
  }
  if (pid !== $("pid").value.trim()) return;  // 그 사이 번호가 바뀜
  box.innerHTML = histCache.length
    ? `<div class="hist-title">이전 검사 ${histCache.length}건</div>` + histCache.map(t => `
        <div class="hist-item"><span class="d">${esc(t.test_date)}</span>
          <span class="m">${esc(panelLabel(t.panel))}${t.total_ige ? " · IgE " + esc(t.total_ige) : ""} · 양성 ${(t.results || []).filter(r => isIgE(r) && r.cls > 0).length}</span>
          <button onclick="loadRecord('${t.id}')">불러오기</button>
          <button class="x" title="삭제" onclick="deleteRecord('${t.id}')">✕</button></div>`).join("")
    : `<div class="hist-empty">저장된 이전 검사 없음 (첫 검사)</div>`;
  box.classList.add("show");
}
function loadRecord(id) {
  const t = histCache.find(x => x.id === id);
  if (!t) return;
  $("ige").value = t.total_ige ?? "";
  $("testDate").value = t.test_date;
  $("panel").value = PANELS[t.panel] ? t.panel : "기타";
  onPanelChange();
  $("rawInput").value = t.raw_input || "";
  generate({ stored: t });
}
async function deleteRecord(id) {
  const t = histCache.find(x => x.id === id);
  if (!t || !confirm(`${t.chart_no} / ${t.test_date} 검사 기록을 삭제할까요?\n(되돌릴 수 없습니다)`)) return;
  const { error } = await sb.from("allergy_tests").delete().eq("id", id);
  if (error) alert("삭제 실패: " + error.message);
  refreshHistory();
}
function setCloudStatus(msg, cls) {
  const el = $("cloudStatus");
  if (el) { el.textContent = msg; el.className = "cloud-status no-print " + (cls || ""); }
}

// ════════════════════════════════════════
//  보고서 생성
// ════════════════════════════════════════
async function generate(opts = {}) {
  const errEl = $("errMsg");
  errEl.style.display = "none";
  // 옛 형식이면 현재 형식으로 바꾸고, 입력 앞부분의 검사일·Total IgE 는 칸에 채움
  const conv = convertLegacy($("rawInput").value);
  if (conv) { $("rawInput").value = conv.text; $("panel").value = "sIgE"; onPanelChange(); }
  const raw = $("rawInput").value.trim();
  if (!raw) { errEl.textContent = "검사 결과를 입력해주세요."; errEl.style.display = "block"; return; }
  const meta = extractMeta(raw);
  const readMeta = [];
  if (meta.date && !opts.stored) { $("testDate").value = meta.date; readMeta.push(`검사일 ${meta.date}`); }
  if (meta.ige && !opts.stored) { $("ige").value = meta.ige; readMeta.push(`Total IgE ${meta.ige}`); }
  // MAST 형식이 아닌데 MAST가 선택돼 있으면 특이 IgE 로 전환
  if (!PANELS[$("panel").value].numeric && !parseMast(meta.text).list.length && parseNumeric(meta.text).list.length) {
    $("panel").value = "sIgE"; onPanelChange();
  }
  const pid   = $("pid").value.trim();
  const pname = $("pname").value.trim();
  const ige   = $("ige").value.trim();
  const panel = $("panel").value;
  const numeric = PANELS[panel].numeric;
  const testDate = $("testDate").value || todayISO();
  const { entries, bad } = buildEntries(panel, meta.text);
  if (!entries.length) {
    errEl.textContent = numeric ? '형식 오류: "dp 45.2, df 38.1, dpg 12.3" 처럼 항목과 수치를 입력하세요.'
                                : '형식 오류: "- Class 1 : 항원명1, 항원명2" 형식으로 입력하세요.';
    errEl.style.display = "block"; return;
  }
  const igeE = entries.filter(e => e.kind === "IgE");
  const pos = igeE.filter(e => e.cls > 0), neg = igeE.filter(e => !e.cls), iggE = entries.filter(e => e.kind === "IgG");
  const byCls = {};
  pos.forEach(e => (byCls[e.cls] = byCls[e.cls] || []).push(e));
  const classSorted = Object.keys(byCls).map(Number).sort((a, b) => b - a);
  const unmatched = igeE.filter(e => !e.item).map(e => e.name);
  const fixed = entries.filter(e => e.fuzzy).map(e => `${e.name} → ${e.canon}`);
  let hasFood = false;

  let rows = "";
  classSorted.forEach(cls => {
    byCls[cls].forEach((e, i) => {
      const d = e.item;
      const clsCell = i === 0
        ? `<td rowspan="${byCls[cls].length}" style="text-align:center;vertical-align:middle;border-right:2px solid #e0e4ec;">
            <span class="cb ${CLASS_COLOR[cls] || "c6"}">Class ${cls}</span><br>
            <span style="font-size:9px;color:#888;">${CLASS_LV[cls] || ""}</span>
           </td>`
        : "";
      const val = e.value != null ? `<div class="val-line">${esc(valStr(e))} kU/L</div>` : "";
      if (d) {
        if (isFood(d)) hasFood = true;
        const cross = (d["교차 반응 가능 항목"] || "").trim();
        const tags = cross && cross !== "없음"
          ? cross.split(/[\s,]+/).filter(Boolean).map(t => `<span class="ct">${esc(t)}</span>`).join("")
          : '<span style="color:#bbb;font-size:9px;">—</span>';
        rows += `<tr>
          ${clsCell}
          <td><span class="aname">${esc(d["항목명"])}</span><span class="season-badge">${esc(d["계절"])}</span>${
            d["위험"] ? `<span class="risk-badge">${esc(d["위험"])} 주의</span>` : ""}${val}${
            d["성분해설"] ? `<div class="comp-note">${esc(d["성분해설"])}</div>` : ""}</td>
          <td>${esc(d["증상 악화 상황"])}</td>
          <td><div class="ctags">${tags}</div></td>
          <td class="warn-txt">${esc(d["주의사항"])}</td>
          <td class="imp-txt">${esc(d["개선 방법"])}</td>
        </tr>`;
      } else {
        rows += `<tr>
          ${clsCell}
          <td colspan="5"><span class="aname">${esc(e.name)}</span> <span style="color:#aaa;font-size:9px;">(DB 미등록)</span>${val}</td>
        </tr>`;
      }
    });
  });
  if (!rows) rows = `<tr><td colspan="6" style="text-align:center;color:#888;padding:12px;">양성(Class 1 이상) 항목 없음</td></tr>`;

  const notices = [
    unmatched.length ? `⚠ DB에 없는 항원명: <b>${unmatched.map(esc).join(", ")}</b> — 오타이거나 DB 별칭 추가가 필요합니다.` : "",
    fixed.length ? `✎ 입력 자동 보정: <b>${fixed.map(esc).join(", ")}</b> — 맞는지 확인하세요.` : "",
    bad.length ? `⚠ 수치를 읽지 못한 입력: <b>${bad.map(esc).join(", ")}</b>` : "",
    readMeta.length ? `📅 입력에서 읽음: <b>${readMeta.map(esc).join(", ")}</b>` : "",
    conv ? `✎ 옛 형식 ${conv.n}줄을 현재 형식으로 변환했습니다 — 항목 이름을 확인하세요.` : "",
    meta.multiDate ? `⚠ 날짜가 여러 개 있습니다. 한 번에 한 검사만 입력하세요 (첫 날짜 사용).` : "",
  ].filter(Boolean).map(t => `<div class="unmatched no-print">${t}</div>`).join("");

  const html = `
    <div id="cloudStatus" class="cloud-status no-print"></div>
    ${notices}
    <div class="rpt-head">
      <div><img src="${LOGO_URI}" alt="청아소아청소년과"></div>
      <div class="rpt-head-right">
        <div class="rpt-title">${numeric ? "특이 IgE 알레르기 검사 안내문" : "알레르기 항원 검사 안내문"}</div>
        <div class="rpt-meta">
          ${pid   ? `<div class="meta-item"><div class="meta-lbl">등록번호</div><div class="meta-val">${esc(pid)}</div></div>` : ""}
          ${pname ? `<div class="meta-item"><div class="meta-lbl">이름</div><div class="meta-val">${esc(pname)}</div></div>` : ""}
          ${ige   ? `<div class="meta-item"><div class="meta-lbl">Total IgE</div><div class="meta-val ige">${esc(ige)} IU/mL</div></div>` : ""}
          <div class="meta-item"><div class="meta-lbl">검사일</div><div class="meta-val" style="font-size:12px;font-weight:500;">${fmtDate(testDate)}</div></div>
        </div>
      </div>
    </div>
    <div class="summary">${numeric
      ? `총 <strong>${igeE.length}개</strong> 항목 측정 · 양성 <strong>${pos.length}개</strong>${iggE.length ? ` · IgG ${iggE.length}개` : ""} · Class가 높을수록 반응 강도가 강합니다`
      : `총 <strong>${pos.length}개</strong> 항원 양성 반응 · Class가 높을수록 반응 강도가 강합니다`}</div>
    ${hasFood ? `<div class="food-note">🍽 식품 항목의 양성은 <b>'감작'</b>으로, 실제로 먹었을 때 반응하는 '알레르기'와 다를 수 있습니다. <b>이미 먹고 증상이 없던 음식은 끊지 마시고</b>, 식이 제한은 담당 의사와 상의해 결정하세요.</div>` : ""}
    <table class="rpt-table">
      <thead>
        <tr>
          <th style="width:70px;">등급</th>
          <th style="width:110px;">항원명</th>
          <th style="width:130px;">증상 악화 상황</th>
          <th>교차반응 항원</th>
          <th style="width:110px;">주의 항목</th>
          <th style="width:120px;">관리 방법</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    ${neg.length ? `<div class="neg-line">음성 (Class 0${numeric ? ", &lt;0.35 kU/L" : ""}): ${neg.map(e => `${esc(e.canon || e.name)}${e.value != null ? " " + esc(valStr(e)) : ""}`).join(", ")}</div>` : ""}
    ${iggE.length && !(sb && currentUser && pid) ? `<div class="neg-line">IgG (mg/L): ${iggE.map(e => `${esc(e.canon)} ${esc(valStr(e))}`).join(", ")}</div>` : ""}
    <div id="cmpSlot"></div>
    <div id="itSlot"></div>
    <div class="rpt-footer">
      ${numeric ? "※ 특이 IgE Class 기준(kU/L): 0 &lt;0.35 · 1 0.35–0.7 · 2 0.7–3.5 · 3 3.5–17.5 · 4 17.5–50 · 5 50–100 · 6 ≥100<br>" : ""}
      ※ 본 결과는 알레르기 검사 결과를 바탕으로 한 안내 자료입니다. 교차반응 항목은 개인에 따라 다를 수 있으며, 실제 반응 여부는 담당 의사와 상담하세요.
    </div>
  `;

  const aiSectionHTML = `
    <div class="ai-section" id="aiSection">
      <div class="ai-section-header">
        <span class="ai-badge">AI</span>
        <span class="ai-title">검사 결과 분석 및 권고사항</span>
        <span class="ai-sub">Claude AI 분석 · 참고용</span>
        <span class="ai-tools no-print"><button id="aiRetry" style="display:none;">AI 재분석</button></span>
      </div>
      <div class="ai-body loading" id="aiBody">
        <div class="ai-spinner"></div> AI가 검사 결과를 분석 중입니다...
      </div>
    </div>
  `;

  const el = $("report");
  el.innerHTML = html + aiSectionHTML;
  el.style.display = "block";
  $("placeholder").style.display = "none";
  el.scrollIntoView({behavior:"smooth",block:"start"});

  // ── 이전 검사 비교 · 면역치료 경과 · 클라우드 저장 ──
  const cur = { chart_no: pid, test_date: testDate, panel, total_ige: ige || null,
                results: entries.map(e => ({ name: e.name, canon: e.canon, kind: e.kind, cls: e.cls, value: e.value, op: e.op || null })),
                raw_input: raw, ai_html: null };
  let cmp = null, savedId = opts.stored ? opts.stored.id : null, history = [], courses = [];
  if (!sb) setCloudStatus("클라우드 미설정 — 저장·비교 없이 보고서만 생성했습니다.");
  else if (!currentUser) setCloudStatus("로그인하지 않아 저장·이전 검사 비교를 하지 않았습니다.", "bad");
  else if (!pid) setCloudStatus("등록번호가 없어 저장·이전 검사 비교를 하지 않았습니다.", "bad");
  else {
    try {
      [history, courses] = await Promise.all([fetchHistory(pid), fetchCourses(pid)]);
      // 같은 검사 종류의 직전 검사 우선, 없으면 종류와 무관하게 직전 검사
      const prev = history.find(t => t.test_date < testDate && t.panel === panel) || history.find(t => t.test_date < testDate);
      if (prev) {
        cmp = compareTests(prev, cur);
        $("cmpSlot").innerHTML = renderCompare(cmp, history);
      }
      if (opts.stored) {
        setCloudStatus(`☁ 저장된 기록을 불러왔습니다 (${testDate})`, "ok");
      } else {
        const saved = await saveTest(cur);
        savedId = saved.id;
        setCloudStatus(`☁ 클라우드에 저장됨 · ${prev ? `이전 검사(${prev.test_date})와 비교` : "첫 검사 기록"}`, "ok");
        refreshHistory();
      }
    } catch (e) {
      setCloudStatus("클라우드 오류: " + e.message, "bad");
    }
  }
  const trend = trendRows([...history.filter(t => !(t.test_date === testDate && t.panel === panel)), { ...cur, __cur: true }]);
  const showIT = courses.length > 0 || (iggE.length > 0 && cloudReady() && !!pid);
  if (showIT) $("itSlot").innerHTML = renderITSection(courses, trend);

  const ai = {
    ige, numeric, pos, neg, cmp,
    it: showIT ? itText(courses, trend) : (iggE.length ? `- 면역치료 기록 없음\n- 이번 IgG: ${iggE.map(e => `${e.canon} ${valStr(e)} mg/L`).join(", ")}` : null),
    onIT: courses.some(c => !c.end_date),
  };
  const run = async () => {
    const out = await runAIAnalysis(ai);
    if (out && savedId && cloudReady()) saveAI(savedId, out);
  };
  $("aiRetry").onclick = run;
  if (opts.stored && opts.stored.ai_html) {
    $("aiBody").className = "ai-body";
    $("aiBody").innerHTML = sanitizeAI(opts.stored.ai_html);
    $("aiRetry").style.display = "";
  } else {
    run();
  }
}

async function runAIAnalysis({ ige, numeric, pos, neg, cmp, it, onIT }) {
  const aiBody = $("aiBody");
  $("aiRetry").style.display = "none";
  aiBody.className = "ai-body loading";
  aiBody.innerHTML = '<div class="ai-spinner"></div> AI가 검사 결과를 분석 중입니다...';

  const byCls = {};
  pos.forEach(e => (byCls[e.cls] = byCls[e.cls] || []).push(e));
  const lines = Object.keys(byCls).map(Number).sort((a, b) => b - a)
    .map(cls => `[Class ${cls}] ` + byCls[cls].map(e => `${e.canon || e.name}${e.value != null ? ` (${valStr(e)} kU/L)` : ""}`).join(", "));
  if (neg.length) lines.push(`[음성 — 측정했으나 Class 0] ` + neg.map(e => `${e.canon || e.name}${e.value != null ? ` (${valStr(e)})` : ""}`).join(", "));

  const detailLines = pos.map(e => {
    const x = e.item;
    if (!x) return `- ${e.name}: (DB 미등록)`;
    return `- ${x["항목명"]} (Class ${e.cls}, ${x["분류"]}${x["위험"] ? ", " + x["위험"] + " 위험" : ""}): 교차반응=${x["교차 반응 가능 항목"]}, 주의=${x["주의사항"]}${x["성분해설"] ? `, 성분=${x["성분해설"]}` : ""}`;
  }).join("\n");

  // 섹션 번호를 상황에 맞게 이어 붙임
  const extra = [];
  if (cmp) extra.push(["이전 검사와 비교", `[이전 검사 대비 변화]에 있는 내용만 사용해 무엇이 좋아지고 나빠졌는지 보호자가 이해하기 쉽게 설명. Class 1단계 변화는 검사 간 변동일 수 있으므로 과도하게 해석하지 말고, 2단계 이상 상승·새로 생긴 Class 3 이상 항원·Total IgE의 큰 변화 위주로 의미를 설명. 검사 종류가 다르다는 표시가 있으면 그 한계를 언급. 관리 효과는 단정하지 말고 가능성으로 표현.`]);
  if (it) extra.push(["면역치료 경과", `[면역치료 정보]만 사용. 사용 중인 약과 기간, 약 변경 이력(이유 포함)을 정리하고, 진드기 수치 추이를 약 변경 전후로 구분해 설명. Dp/Df IgG 상승은 면역치료에 대한 면역 반응과 꾸준한 복용을 시사하는 보조 지표이고, 특이 IgE는 치료 초기에 일시적으로 오르다가 수년에 걸쳐 내려갈 수 있으므로 단기 상승을 치료 실패로 해석하지 말 것. 수치는 임상 효과와 일대일로 대응하지 않으며 증상 호전이 가장 중요함을 강조. 진행 중이면 다음 추적 검사(6~12개월 후)를 안내.`]);

  // 환자 이름·등록번호는 AI 에 보내지 않음 (분석에 불필요한 식별정보)
  const prompt = `당신은 소아청소년과 전문의를 보조하는 알레르기 전문 AI입니다.

[중요 기준 - 반드시 준수]
- Total IgE 정상 범위: 100 IU/mL 미만. 100 IU/mL 이상은 elevated로 설명할 것
- "150 IU/mL 이상 비정상" 같은 표현 절대 사용 금지
- Class 등급: 1-2 경증, 3-4 중등도, 5-6 중증
- 검사 결과에 없는 항원은 절대 언급하지 말 것. 결과에 없는 항원에 대해 "없어서 다행" 같은 언급도 금지. [음성] 항목은 측정했으나 음성인 항목으로, 임상적 의미가 있을 때만 언급할 것.
- 설하면역치료는 위 검사 결과 목록에 집먼지진드기(Dp) 또는 집먼지진드기(Df)가 실제로 양성인 경우에만 5번 항목에서 언급할 것. 집먼지(house dust)만 양성이고 집먼지진드기(Dp/Df)가 없는 경우에도 설하면역치료 언급 완전 금지.
- ${onIT

- Total IgE가 60 IU/mL 이상으로 elevated되어 있으나 모든 항원이 Class 2 이하로 낮은 경우, 5번 항목에서 콜린성두드러기(운동, 열, 땀 등 자극에 의한 두드러기) 가능성을 고려해야 함을 언급할 것. 단, IgE가 60 미만이거나 Class 3 이상 항원이 있는 경우, 또는 Total IgE가 없는 경우에는 콜린성두드러기 언급 금지.
- 식품 항원 양성은 '감작'이며 실제로 먹었을 때의 알레르기와 다를 수 있음. 이미 먹고 증상이 없던 식품은 계속 먹어도 된다는 원칙을 4번에 포함하고, 검사 결과만으로 불필요한 식이 제한을 권하지 말 것.
- 계란 성분 해석: 난백점소(오보뮤코이드)는 열에 강해 양성이면 충분히 가열한 계란에도 반응할 수 있고 알레르기가 오래갈 가능성을 시사함. 오보뮤코이드가 음성이고 난백알부민(오브알부민) 위주로 양성이면 충분히 가열한 계란(베이킹 제품 등)은 먹을 수 있는 경우가 많음. 섭취 시도는 반드시 의사 지도하에 하도록 안내.
- 계란 알레르기가 있어도 독감 등 예방접종은 접종 가능함. 백신 회피를 권하지 말 것.
- 결과에 CCD가 있으면 1번 항목에서 꽃가루·과일·채소·견과류 등 식물성 항원 결과가 CCD 때문에 실제보다 높게(위양성) 나올 수 있음을 언급할 것. CCD가 없으면 CCD 언급 금지.
- 생선(대구·연어 등)과 조개류(홍합·굴 등)는 서로 교차반응하지 않음.

// 로그인 상태면 서버(Edge Function, 키는 서버에 보관) 경유, 아니면 로컬 키로 직접 호출
async function callAI(prompt) {
  if (cloudReady()) {
    const { data, error } = await sb.functions.invoke("analyze", { body: { prompt } });
    if (error) {
      let msg = error.message;
      try { const j = await error.context.json(); msg = j.error || msg; } catch (_) {}
      throw new Error(msg);
    }
    return data.text || "";
  }
  // ASCII 범위 문자만 허용 (비ASCII 문자 제거)
  const apiKey = $("apiKey").value.trim().replace(/[^ -~]/g, "");
  if (!apiKey) throw new Error("NO_KEY");
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({ model: AI_MODEL, max_tokens: 4000, messages: [{ role: "user", content: prompt }] })
  });
  if (!response.ok) {
    const errData = await response.json().catch(() => ({}));
    throw new Error(errData?.error?.message || "HTTP " + response.status);
  }
  const data = await response.json();
  return data.content.map(b => b.text || "").join("");
}

function saveApiKey() {
  const key = $("apiKey").value.trim();
  if (!key) { showKeyStatus("키를 입력해주세요", "#c0392b"); return; }
  localStorage.setItem("chungah_anthropic_key", key);
  showKeyStatus("저장되었습니다", "#27ae60");
}

function clearApiKey() {
  localStorage.removeItem("chungah_anthropic_key");
  $("apiKey").value = "";
  showKeyStatus("삭제되었습니다", "#e67e22");
}

function showKeyStatus(msg, color) {
  const el = $("apiKeyStatus");
  el.textContent = msg;
  el.style.color = color;
  setTimeout(() => { el.textContent = ""; }, 3000);
}

function loadApiKey() {
  let saved = null;
  try { saved = localStorage.getItem("chungah_anthropic_key"); } catch (_) {}
  if (saved) {
    $("apiKey").value = saved;
    $("apiKeyStatus").textContent = "저장된 키 불러옴";
    $("apiKeyStatus").style.color = "#27ae60";
  }
  try { const p = localStorage.getItem("chungah_panel"); if (p && PANELS[p]) $("panel").value = p; } catch (_) {}
}
